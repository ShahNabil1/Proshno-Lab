name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  subscription-matcher:
    name: subscriptionMatcher unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run subscriptionMatcher tests
        run: npm test -- src/lib/subscriptionMatcher.test.ts

      - name: Run full test suite
        if: success()
        run: npm test

      - name: Run transactional CAPI queue checks
        run: node tests/meta-capi-outbox.mjs

      - name: Check marketing dashboard aggregates and permissions
        run: node tests/marketing-dashboard.mjs

      - name: Run server conversion and payment checks
        run: npx --yes deno@2.9.6 test --allow-env tests/custom-package-payments.ts tests/extract-bulk-questions.ts tests/meta-capi.test.ts tests/meta-capi-worker.test.ts tests/payment-telegram-worker.ts tests/payment-checkout-exit.ts

      - name: Check Telegram notification authorization
        run: node tests/notification-security-sql.mjs

      - name: Check payment alert timing
        run: node tests/payment-alert-timing.mjs

      - name: Check Class 9 English chapter template
        run: node tests/class-nine-english-pattern.mjs
