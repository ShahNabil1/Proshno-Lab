name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  subscription-matcher:
    name: subscriptionMatcher unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run subscriptionMatcher tests
        run: npm test -- src/lib/subscriptionMatcher.test.ts

      - name: Run full test suite
        if: success()
        run: npm test
