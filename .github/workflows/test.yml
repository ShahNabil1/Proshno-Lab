name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  subscription-matcher:
    name: subscriptionMatcher unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run subscriptionMatcher tests
        run: bun run test -- src/lib/subscriptionMatcher.test.ts

      - name: Run full test suite
        if: success()
        run: bun run test
